<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vLLM Admin — Sign in</title>
<style>
  :root {
    --bg-body: #0f1117;
    --bg-card: #1a1d27;
    --bg-input: #22252f;
    --border-card: #2a2d37;
    --border-input: #333;
    --text-primary: #e0e0e0;
    --text-heading: #fff;
    --text-secondary: #888;
    --accent: #6c8cff;
    --red: #c62828;
  }
  body.light-theme {
    --bg-body: #f5f6fa;
    --bg-card: #ffffff;
    --bg-input: #f0f1f5;
    --border-card: #ddd;
    --border-input: #ccc;
    --text-primary: #222;
    --text-heading: #111;
    --text-secondary: #666;
    --accent: #4a6adf;
    --red: #d32f2f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-body);
    color: var(--text-primary);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
  }
  h1 { color: var(--text-heading); font-size: 1.25rem; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-secondary); }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(198, 40, 40, 0.15);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    font-size: 0.85rem;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>vLLM Admin</h1>
  <p class="sub">Enter your admin API key to continue.</p>
  <form id="login-form">
    <label for="api-key">API key</label>
    <input id="api-key" type="password" autocomplete="current-password" autofocus>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <div class="error" id="error"></div>
</div>
<script>
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');

  // Where to go after login: a same-origin ?next= path (e.g. /cluster), else "/".
  function nextTarget() {
    try {
      const p = new URLSearchParams(location.search).get('next');
      if (p && p.startsWith('/') && !p.startsWith('//')) return p;
    } catch (e) {}
    return '/';
  }

  (async () => {
    try {
      const res = await fetch('/api/auth/status');
      const d = await res.json();
      if (!d.auth_enabled || d.authenticated) window.location.href = nextTarget();
    } catch (e) { /* ignore */ }
  })();

  const form = document.getElementById('login-form');
  const errBox = document.getElementById('error');
  const submitBtn = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('visible');
    const key = document.getElementById('api-key').value.trim();
    if (!key) return;
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: key }),
      });
      if (res.ok) {
        window.location.href = nextTarget();
      } else {
        const d = await res.json().catch(() => ({}));
        errBox.textContent = d.error || 'Invalid API key';
        errBox.classList.add('visible');
        submitBtn.disabled = false;
      }
    } catch (err) {
      errBox.textContent = 'Request failed: ' + err.message;
      errBox.classList.add('visible');
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
